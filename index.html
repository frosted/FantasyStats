<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboards & Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #3fb950;
            --accent-glow: rgba(63, 185, 80, 0.15);
            --radius: 12px;
            --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            width: fit-content;
            border: 1px solid rgba(63, 185, 80, 0.3);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            background-color: var(--surface-hover);
            border-color: #8b949e;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .arrow-icon {
            width: 16px;
            height: 16px;
            stroke: var(--text-secondary);
            transition: transform 0.2s ease, stroke 0.2s ease;
        }

        .card:hover .arrow-icon {
            transform: translate(2px, -2px);
            stroke: var(--text-primary);
        }

        .card-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        footer {
            margin-top: auto;
            padding-top: 3rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="badge">
                <span class="badge-dot"></span>
                Live Metrics
            </div>
            <h1>Dashboards</h1>
            <p class="subtitle">Select a report below to view real-time automated statistics.</p>
        </header>

        <main class="dashboard-grid">
            <a class="card" href="Dashboards/TeamDashboard_2027.html">
                <div>
                    <div class="card-header">
                        <span class="card-title">Teamdashboard 2027</span>
                        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </div>
                    <p class="card-description">Automated report generated from live web metrics.</p>
                </div>
            </a>

        </main>

        <footer>
            Updated automatically via GitHub Actions
        </footer>
    </div>

</body>
</html>
